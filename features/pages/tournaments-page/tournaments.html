<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="tournaments.title"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/tournaments.css">
  <link rel="stylesheet" href="../../shared/shell/css/shell.css">
  <link rel="icon" type="image/x-icon"
    href="https://res.cloudinary.com/dmmunstfz/image/upload/q_auto/f_auto/v1776456354/BonkRankLogo_tbhxaw.png">
  <script src="../../shared/themeSwitcher.js"></script>
  <script src="../../shared/i18n/locales/pt-BR.js"></script>
  <script src="../../shared/i18n/locales/en.js"></script>
  <script src="../../shared/i18n/i18n.js"></script>
</head>

<body>

  <header class="navbar bg-body-tertiary" data-site-topbar></header>

  <main class="container py-4">

    <h1 class="h3 fw-bold mb-4" data-i18n="tournaments.heading"></h1>

    <!-- Barra de pesquisa: filtra os torneios por nome enquanto digita -->
    <form class="tournaments-search mb-4" onsubmit="return false">
      <div class="input-group rounded-3 shadow-sm">
        <span class="input-group-text">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input type="text" class="form-control" id="tournament-search" data-i18n-placeholder="tournaments.searchPlaceholder"
          autocomplete="off">
        <button type="button" class="btn btn-outline-secondary clear-btn" aria-label="" data-i18n-aria="tournaments.clearSearch">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </form>

    <!-- Grid de torneios: cada card inteiro é clicável e leva ao chaveamento -->
    <div id="tournaments-container" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../shared/shell/settings.js"></script>
  <script src="../../shared/shell/shell.js"></script>
  <script src="../../api/tournamentsData.js"></script>
  <script src="js/renderList.js"></script>
  <script src="js/tournamentController.js"></script>

</body>

</html>
