<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-title="search.title"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="../../shared/topbar/css/topbar.css">
  <link rel="icon" type="image/x-icon"
    href="https://res.cloudinary.com/dmmunstfz/image/upload/q_auto/f_auto/v1776456354/BonkRankLogo_tbhxaw.png">
  <script src="../../shared/themeSwitcher.js"></script>
  <script src="../../shared/i18n/locales/pt-BR.js"></script>
  <script src="../../shared/i18n/locales/en.js"></script>
  <script src="../../shared/i18n/i18n.js"></script>
</head>

<body>

  <header class="navbar bg-body-tertiary" data-site-topbar></header>

  <main class="container search-main py-4">
    <div class="row g-4">

      <!-- Sidebar de Filtros -->
      <aside class="col-12 col-md-4 col-lg-3">
        <div class="filter-sidebar rounded-3 p-3">

          <!-- Accordion de filtros: cada grupo (Region/Rank) vira um painel
               colapsável para não exibir todas as checkboxes de uma vez. -->
          <div class="accordion filter-accordion" id="filterAccordion">

            <!-- Região: cada checkbox carrega filter-region -->
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button" type="button" data-bs-toggle="collapse"
                  data-bs-target="#collapse-region" aria-expanded="true" aria-controls="collapse-region" data-i18n="search.filterRegion">
                </button>
              </h2>
              <div id="collapse-region" class="accordion-collapse collapse show" data-bs-parent="#filterAccordion">
                <div class="accordion-body">
                  <div class="filter-group" data-filter-type="region">
                    <ul class="filter-list list-unstyled d-flex flex-wrap gap-3 mb-0 flex-md-column gap-md-2">
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="BR" class="form-check-input filter-region">
                          BR
                        </label>
                      </li>
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="USA" class="form-check-input filter-region">
                          USA
                        </label>
                      </li>
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="EU" class="form-check-input filter-region">
                          EU
                        </label>
                      </li>
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="AU" class="form-check-input filter-region">
                          AU
                        </label>
                      </li>
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="RU" class="form-check-input filter-region">
                          RU
                        </label>
                      </li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>

            <!-- Rank: checkboxes, 1+ selecionáveis, cada um com filter-rank -->
            <div class="accordion-item">
              <h2 class="accordion-header">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                  data-bs-target="#collapse-rank" aria-expanded="false" aria-controls="collapse-rank" data-i18n="search.filterRank">
                </button>
              </h2>
              <div id="collapse-rank" class="accordion-collapse collapse" data-bs-parent="#filterAccordion">
                <div class="accordion-body">
                  <div class="filter-group" data-filter-type="rank">
                    <ul class="filter-list list-unstyled d-flex flex-wrap gap-3 mb-0 flex-md-column gap-md-2">
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="S+" class="form-check-input filter-rank">
                          S+
                        </label>
                      </li>
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="S" class="form-check-input filter-rank">
                          S
                        </label>
                      </li>
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="S-" class="form-check-input filter-rank">
                          S-
                        </label>
                      </li>
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="A+" class="form-check-input filter-rank">
                          A+
                        </label>
                      </li>
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="A" class="form-check-input filter-rank">
                          A
                        </label>
                      </li>
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="A-" class="form-check-input filter-rank">
                          A-
                        </label>
                      </li>
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="B+" class="form-check-input filter-rank">
                          B+
                        </label>
                      </li>
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="B" class="form-check-input filter-rank">
                          B
                        </label>
                      </li>
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="B-" class="form-check-input filter-rank">
                          B-
                        </label>
                      </li>
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="C+" class="form-check-input filter-rank">
                          C+
                        </label>
                      </li>
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="C" class="form-check-input filter-rank">
                          C
                        </label>
                      </li>
                      <li>
                        <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                          <input type="checkbox" value="C-" class="form-check-input filter-rank">
                          C-
                        </label>
                      </li>
                    </ul>
                  </div>
                </div>
              </div>
            </div>

          </div>

        </div>
      </aside>

      <!-- Resultados -->
      <section class="col-12 col-md-8 col-lg-9 search-content">
        <form action="searchPage.html" method="get" class="topbar-form mb-4">
          <div class="input-group rounded-3 shadow-sm">
            <span class="input-group-text">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <input type="text" name="q" class="form-control topbar-input" id="topbar-input" data-i18n-placeholder="search.placeholder" autocomplete="off">
            <button type="button" class="btn btn-outline-secondary clear-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </form>

        <p class="search-query-label text-secondary small" id="query-label"></p>
        <div id="results-container" class="results-grid d-flex flex-column gap-2"></div>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../shared/topbar/settings.js"></script>
  <script src="../../shared/topbar/topbar.js"></script>
  <script src="../../api/data.js"></script>
  <script src="js/renderResults.js"></script>
  <script src="js/searchController.js"></script>

</body>

</html>
