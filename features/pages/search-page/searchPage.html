<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados — BonkRANKS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/search.css">
  <link rel="icon" type="image/x-icon"
    href="https://res.cloudinary.com/dmmunstfz/image/upload/q_auto/f_auto/v1776456354/BonkRankLogo_tbhxaw.png">
</head>

<body>

  <header class="navbar bg-body-tertiary">
    <div class="container">
      <a href="../../../index.html" class="navbar-brand d-flex align-items-center gap-2">
        <img class="rounded-circle"
          src="https://res.cloudinary.com/dmmunstfz/image/upload/q_auto/f_auto/v1776456354/BonkRankLogo_tbhxaw.png"
          width="36" height="36" alt="Logo BonkRANKS">
        <span class="fw-bold">BonkRANKS</span>
      </a>
    </div>
  </header>

  <main class="container search-main py-4">
    <div class="row g-4">

      <!-- Sidebar de Filtros -->
      <aside class="col-12 col-md-4 col-lg-3">
        <div class="filter-sidebar border rounded-3 p-3 bg-body-tertiary">

          <div class="filter-group mb-4" data-filter-type="region">
            <h3 class="filter-title text-secondary">Region</h3>
            <ul class="filter-list list-unstyled d-flex flex-wrap gap-3 mb-0 flex-md-column gap-md-2">
              <li>
                <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                  <input type="checkbox" value="BR" class="form-check-input filter-checkbox">
                  BR
                </label>
              </li>
              <li>
                <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                  <input type="checkbox" value="NA" class="form-check-input filter-checkbox">
                  NA
                </label>
              </li>
              <li>
                <label class="filter-option form-check d-flex align-items-center gap-2 mb-0">
                  <input type="checkbox" value="EU" class="form-check-input filter-checkbox">
                  EU
                </label>
              </li>
            </ul>
          </div>

          <div class="filter-group" data-filter-type="rank">
            <h3 class="filter-title text-secondary">Rank</h3>
            <select class="form-select filter-select" id="rank-filter">
              <option value="all">All Ranks</option>
              <option value="S+">S+</option>
              <option value="S">S</option>
              <option value="S-">S-</option>
              <option value="A+">A+</option>
              <option value="A">A</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B">B</option>
              <option value="B-">B-</option>
              <option value="C+">C+</option>
              <option value="C">C</option>
              <option value="C-">C-</option>
            </select>
          </div>

        </div>
      </aside>

      <!-- Resultados -->
      <section class="col-12 col-md-8 col-lg-9 search-content">
        <form action="searchPage.html" method="get" class="topbar-form mb-4">
          <div class="input-group rounded-pill overflow-hidden shadow-sm">
            <span class="input-group-text">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <input type="text" name="q" class="form-control topbar-input" id="topbar-input" placeholder="Nova busca..." autocomplete="off">
            <button type="button" class="btn btn-outline-secondary clear-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </form>

        <p class="search-query-label text-secondary small" id="query-label"></p>
        <div id="results-container" class="results-grid d-flex flex-column gap-2"></div>
      </section>

    </div>
  </main>

  <!-- Dados e utilitários do projeto. Na proposta os caminhos apontam
       para o projeto real para funcionar ao abrir; quando aplicado ao
       site, voltam a ser ../../api/data.js e ./js/search.js -->
  <script src="../../api/data.js"></script>
  <script src="js/search.js"></script>
  <script src="js/renderSearch.js"></script>

</body>

</html>
