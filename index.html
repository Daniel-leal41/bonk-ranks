<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BonkRANKS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./features/pages/index-page/css/index.css">
  <link rel="stylesheet" href="./features/shared/topbar/css/topbar.css">
  <link rel="icon" type="image/x-icon" href="https://res.cloudinary.com/dmmunstfz/image/upload/q_auto/f_auto/v1776456354/BonkRankLogo_tbhxaw.png">
  <script src="./features/shared/themeSwitcher.js"></script>
  <script src="./features/shared/i18n/locales/pt-BR.js"></script>
  <script src="./features/shared/i18n/locales/en.js"></script>
  <script src="./features/shared/i18n/i18n.js"></script>
</head>

<body>

  <header class="navbar bg-body-tertiary" data-site-topbar></header>

  <main class="home-wrapper d-flex align-items-center justify-content-center py-5">
    <div class="container text-center home-content">
      <img id="dynamic-avatar" class="big-avatar" src="https://res.cloudinary.com/dmmunstfz/image/upload/q_auto/f_auto/v1776456354/BonkRankLogo_tbhxaw.png" alt="" data-i18n-alt="home.avatarAlt">

      <h1 class="home-title fw-bold mb-3">
        <span data-i18n="home.tagline1"></span><br>
        <span id="dynamic-word" class="text-primary" data-i18n="home.tagline2"></span><br>
        <span data-i18n="home.tagline3"></span>
      </h1>
      <p class="lead text-muted mb-4" data-i18n="home.subtitle"></p>

      <form action="./features/pages/search-page/searchPage.html" method="get" class="home-form mx-auto">
        <div class="input-group">
          <span class="input-group-text">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input type="text" name="q" class="form-control form-control-lg" data-i18n-placeholder="home.searchPlaceholder" autocomplete="off" required>
        </div>
      </form>

      <a href="./features/pages/search-page/searchPage.html" class="btn btn-outline-primary btn-lg mt-4" data-i18n="home.browseAll"></a>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./features/shared/topbar/settings.js"></script>
  <script src="./features/shared/topbar/topbar.js"></script>

</body>

</html>
